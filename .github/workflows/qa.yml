name: Autonomous QA Testing Agent

# Two independent jobs, per the safety review (see the chat where this
# was raised) — never mixed into one:
#
#   production-monitor  — read-only tier ONLY (qa/tests/readonly), run
#                          directly against the real live app
#                          (QA_BASE_URL=production). No test in this job
#                          can create, edit, or delete anything — see
#                          qa/tests/readonly's own file header. Runs on
#                          the twice-daily schedule and on demand.
#
#   full-suite           — everything (unit + readonly + workflow +
#                          regression), run against the app started
#                          LOCALLY on the runner with NO Supabase
#                          credentials in its environment, so
#                          lib/db.ts's dual-mode data layer falls back to
#                          the in-memory seed store automatically — the
#                          same mechanism every Vercel preview deployment
#                          already relies on. This is where every
#                          write-based simulation (Quick Job creation,
#                          filing email, submitting bug reports) lives;
#                          it NEVER runs with QA_BASE_URL pointed at
#                          production. Runs on every pull request
#                          targeting main (main auto-deploys, so this is
#                          the practical "before it reaches production"
#                          gate) and on demand.
#
# Both jobs call qa/lib/report-results.mjs afterward with the public
# Supabase anon key (not a secret, not a service-role key) — see that
# script's header and supabase/migrations/0039 and 0040 for exactly what
# that credential can and cannot do, enforced by Postgres RLS.

on:
  schedule:
    # 8:00am/8:00pm in both EDT (UTC-4) and EST (UTC-5) — the should-run
    # job below is the actual DST-correct gate; the other two firings
    # each day exit immediately without hitting production.
    - cron: "0 12 * * *" # 8am EDT
    - cron: "0 13 * * *" # 8am EST
    - cron: "0 0 * * *" # 8pm EDT
    - cron: "0 1 * * *" # 8pm EST
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      trigger_label:
        description: "Who/what triggered this (shown on the QA dashboard)"
        required: false
        default: "manual"

concurrency:
  group: qa-agent
  cancel-in-progress: false # never cancel a run that might be mid-write to the dashboard tables

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" = "08" ] || [ "$hour" = "20" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  production-monitor:
    needs: should-run
    if: needs.should-run.outputs.go == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run read-only checks against production
        id: tests
        run: npx playwright test qa/tests/readonly
        continue-on-error: true
        env:
          QA_BASE_URL: ${{ vars.QA_PRODUCTION_URL || 'https://nolan-select-floors.vercel.app' }}

      - name: Report results
        if: always()
        run: node qa/lib/report-results.mjs
        env:
          QA_TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          QA_RUN_NOTES: "production read-only monitor"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-production-monitor-${{ github.run_id }}
          path: qa/results/
          retention-days: 30

      - name: Fail the workflow if production checks failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  full-suite:
    needs: should-run
    if: needs.should-run.outputs.go == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build app (no Supabase credentials — forces in-memory test data)
        run: npm run build
        env:
          # Deliberately NOT setting NEXT_PUBLIC_SUPABASE_URL /
          # SUPABASE_SERVICE_ROLE_KEY here — see lib/db.ts#sb and the file
          # header above. Sentry/QuickBooks/Resend keys are also
          # deliberately omitted so none of those integrations are live
          # during a test run.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start app
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/dashboard > /dev/null && exit 0
            sleep 2
          done
          echo "App never came up" >&2
          exit 1

      - name: Run full QA suite (unit + readonly + workflow + regression)
        id: tests
        run: npx playwright test
        continue-on-error: true

      - name: Report results
        if: always()
        run: node qa/lib/report-results.mjs
        env:
          QA_TRIGGER: ${{ github.event_name == 'pull_request' && 'deployment' || 'manual' }}
          QA_RUN_NOTES: "full suite (isolated, in-memory)"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-full-suite-${{ github.run_id }}
          path: qa/results/
          retention-days: 30

      - name: Fail the workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
