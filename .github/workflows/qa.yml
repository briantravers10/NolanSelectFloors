name: Autonomous QA Testing Agent

# Three ways this runs, all documented in qa/README.md:
#   1. Scheduled, twice daily (8am/8pm America/New_York, DST-aware — see
#      the "should-run" job below, since GitHub cron is UTC-only).
#   2. On every pull request targeting main — i.e. before the change that
#      PR represents ever reaches production, since main auto-deploys.
#   3. On demand, via workflow_dispatch — this is what the "Run QA Tests
#      Now" button on /qa calls (see app/qa/actions.ts).
#
# Every run starts the app LOCALLY on the runner with no Supabase
# credentials in its environment, so lib/db.ts's dual-mode data layer
# falls back to the in-memory seed store automatically — the same
# mechanism every preview deployment already relies on. There is no
# secret or code path in this workflow that can reach the production
# database, QuickBooks, or Resend email for anything the tests DO. The
# only production credential used anywhere here is a Supabase
# service-role key, used ONLY by qa/lib/report-results.mjs, ONLY to
# write to qa_test_runs / qa_findings / bug_reports — see that file.

on:
  schedule:
    # 8:00am/8:00pm in both EDT (UTC-4) and EST (UTC-5) — the should-run
    # job below is the actual DST-correct gate; the other three firings
    # each day exit immediately without starting a browser.
    - cron: "0 12 * * *" # 8am EDT
    - cron: "0 13 * * *" # 8am EST
    - cron: "0 0 * * *" # 8pm EDT
    - cron: "0 1 * * *" # 8pm EST
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      trigger_label:
        description: "Who/what triggered this (shown on the QA dashboard)"
        required: false
        default: "manual"

concurrency:
  group: qa-agent
  cancel-in-progress: false # never cancel a run that might be mid-write to the dashboard tables

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" = "08" ] || [ "$hour" = "20" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  qa:
    needs: should-run
    if: needs.should-run.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app (no Supabase credentials — forces in-memory test data)
        run: npm run build
        env:
          # Deliberately NOT setting NEXT_PUBLIC_SUPABASE_URL /
          # SUPABASE_SERVICE_ROLE_KEY here — see lib/db.ts#sb and the file
          # header above. Sentry/QuickBooks/Resend keys are also
          # deliberately omitted so none of those integrations are live
          # during a test run.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start app
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/dashboard > /dev/null && exit 0
            sleep 2
          done
          echo "App never came up" >&2
          exit 1

      - name: Run QA test suite
        id: tests
        run: npx playwright test
        continue-on-error: true # always report results, even on failure — never let this step silently stop the workflow

      - name: Report results (dashboard + bug reports)
        if: always()
        run: node qa/lib/report-results.mjs
        env:
          QA_TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'pull_request' && 'deployment' || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload test artifacts (screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-${{ github.run_id }}
          path: qa/results/
          retention-days: 30

      - name: Fail the workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
